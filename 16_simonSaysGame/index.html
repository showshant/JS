<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Simon Says Game</title>
</head>

<body>
    <h1>Simon Says Game</h1>
    <h2>Press any Key to start.</h2>
    <div class="btn-container">
        <div class="line-one">
            <div class="btn red" type="'buton">1</div>
            <div class="btn green" type="'buton">2</div>
        </div>
        <div class="line-two">
            <div class="btn yellow" type="'buton">3</div>
            <div class="btn purple" type="'buton">4</div>
        </div>

    </div>


    <script src="script.js"></script>
</body>

</html>
